# REAL-TARGET AUDIT (plan: peppy-gliding-steele; D-019).
# System under test: a published, deployable open-source screening pipeline
# (github.com/haroon-sajid/resume-screening-app @ 49dc41a), operated
# entirely by us on our own keys. Its 4-agent chain is reproduced
# faithfully at runtime from the pinned, hash-verified source — the
# unlicensed upstream prompts are never stored in this repository.
# Freeform mode: the pipeline's output prose is audited untouched.
# T=0.7 matches the upstream stack's own default (as-deployed realism).
# Upstream pins retired model llama3-70b-8192; we run the served
# successor llama-3.3-70b-versatile and disclose (a finding in itself).
audit_id: realtarget-hs-screener-001
audit_seed: 42
max_spend_usd: 1.50
concurrency: 1        # Groq free-tier pacing
corpus_path: corpora/starter-v1/cases.yaml
output_dir: audits
canonicaliser:
  provider: openai
  model: gpt-4.1-2025-04-14
extractor:
  provider: openai
  model: gpt-4.1-2025-04-14
pricing:
  gpt-4.1-2025-04-14: {input: 2.00, output: 8.00}
  llama-3.3-70b-versatile: {input: 0.0, output: 0.0}  # Groq free tier
conditions:
  - {temperature: 0.7, repeats: 5}
suts:
  - name: hs-resume-screener
    provider: openai_compatible
    model: llama-3.3-70b-versatile
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    elicitation_mode: freeform
    prompt_template: "<<<CV>>>\n{cv}\n<<<JD>>>\n{job_spec}"
    params:
      pipeline: hs-resume-screener
      upstream_sha: 49dc41a11b5cd9f5655a43f148cb9cf4e71fa544
