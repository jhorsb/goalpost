# REAL-TARGET AUDIT, quota workaround (D-021).
# Same audited artifact as realtarget-hs-screener.yaml (the published
# 4-agent pipeline @ pinned SHA, prompts fetched+verified at runtime);
# the SERVING MODEL changes and this is a material, disclosed deviation:
#   upstream pins llama3-70b-8192  -> RETIRED everywhere
#   Groq run (audit -001)          -> llama-3.3-70b-versatile, 4/25 cases
#                                     (100k tokens/day free cap)
#   this run (audit -002)          -> gpt-oss-120b on Cerebras free tier
#                                     (1M tokens/day; no Llama served on
#                                      this account)
# So this audits the pipeline's PROMPT AND CHAIN DESIGN served by a current
# open-weights model - not the pipeline "as originally deployed", which is
# no longer runnable at all. Separate audit_id keeps the two measurements
# distinct (model is part of sut_id). gpt-oss-120b is a reasoning model:
# max_tokens is raised so the answer is not truncated by reasoning tokens.
audit_id: realtarget-hs-screener-002-gptoss
audit_seed: 42
max_spend_usd: 1.50
concurrency: 1
corpus_path: corpora/starter-v1/cases.yaml
output_dir: audits
canonicaliser:
  provider: openai
  model: gpt-4.1-2025-04-14
extractor:
  provider: openai
  model: gpt-4.1-2025-04-14
pricing:
  gpt-4.1-2025-04-14: {input: 2.00, output: 8.00}
  gpt-oss-120b: {input: 0.0, output: 0.0}   # Cerebras free tier
conditions:
  - {temperature: 0.7, repeats: 5}
suts:
  - name: hs-resume-screener
    provider: openai_compatible
    model: gpt-oss-120b
    base_url: https://api.cerebras.ai/v1
    api_key_env: CEREBRAS_API_KEY
    send_seed: false      # Cerebras shim; containment covers rejection
    max_tokens: 3000      # reasoning headroom (verified: ~1.1k completion)
    elicitation_mode: freeform
    prompt_template: "<<<CV>>>\n{cv}\n<<<JD>>>\n{job_spec}"
    params:
      pipeline: hs-resume-screener
      upstream_sha: 49dc41a11b5cd9f5655a43f148cb9cf4e71fa544
