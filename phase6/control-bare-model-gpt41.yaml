# CONTROL for the real-target audit (D-027).
# Same model (gpt-oss-120b/Cerebras), same frozen corpus, same conditions,
# same extraction lens (v3 + gpt-4.1) as realtarget-hs-screener-002-gptoss
# — but a PLAIN screening prompt instead of the published pipeline's
# 4-agent chain. Difference between this and the target is therefore
# attributable to the pipeline's DESIGN, not to the serving model.
# Also supplies the first apples-to-apples freeform comparison point:
# every earlier lab configuration was measured in structured mode (no
# extractor), so those cross-comparisons were architecture-confounded.
audit_id: control-bare-model-gpt41-001
audit_seed: 42
max_spend_usd: 1.20
concurrency: 1
corpus_path: corpora/starter-v1/cases.yaml
output_dir: audits
canonicaliser:
  provider: openai
  model: gpt-4.1-2025-04-14
extractor:
  provider: openai
  model: gpt-4.1-2025-04-14
pricing:
  gpt-4.1-2025-04-14: {input: 2.00, output: 8.00}
  gpt-oss-120b: {input: 0.0, output: 0.0}
conditions:
  - {temperature: 0.7, repeats: 5}
suts:
  - name: bare-model-control
    provider: openai_compatible
    model: gpt-oss-120b
    base_url: https://api.cerebras.ai/v1
    api_key_env: CEREBRAS_API_KEY
    send_seed: false
    max_tokens: 3000
    elicitation_mode: freeform
    prompt_template_path: prompts/example_screener.txt
