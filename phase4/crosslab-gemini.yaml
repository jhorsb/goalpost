# Cross-lab SUT via Google AI Studio FREE tier (no card required).
# Key: https://aistudio.google.com -> "Get API key" -> GEMINI_API_KEY in .env
# Google serves an OpenAI-compatible endpoint; model id current as of
# 2026-07 — check https://ai.google.dev/models if this 404s.
# Free-tier rate limits are low; concurrency kept at 1.
audit_id: phase4-crosslab-gemini-001
audit_seed: 42
max_spend_usd: 1.00
concurrency: 1
corpus_path: corpora/starter-v1/cases.yaml
output_dir: audits
canonicaliser:
  provider: openai
  model: gpt-4.1-2025-04-14   # stays on your OpenAI credit; differs from SUT
extractor:
  provider: openai
  model: gpt-4.1-2025-04-14
pricing:
  gpt-4.1-2025-04-14: {input: 2.00, output: 8.00}
  gemini-2.5-flash: {input: 0.0, output: 0.0}   # free tier
conditions:
  - {temperature: 0.0, repeats: 5}
suts:
  - name: gemini-2.5-flash
    provider: openai_compatible
    model: gemini-2.5-flash
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    send_seed: false   # AI Studio's OpenAI-compat shim rejects `seed`
    elicitation_mode: structured
    prompt_template_path: prompts/example_screener.txt
