  job_spec_text: 'GlobePay Solutions – Customer Support Team Lead


    GlobePay Solutions is a fast-growing payments provider based in Kingsford, offering
    a reliable suite of digital payment services to SMEs across the UK. We are seeking
    a Customer Support Team Lead to manage and inspire our frontline support team
    of 8 agents. Reporting to the Head of Operations, you will own customer escalations,
    ensure we hit SLAs, and act as a key point of contact for complex queries. You
    will coach and develop your team, deliver regular feedback, and support ongoing
    training needs.


    This role also partners closely with Product and IT to suggest and implement tooling
    improvements, enhancing support efficiency and customer experience. As a people-focused
    leader, you’ll foster a collaborative team culture and drive continuous improvement.


    Requirements:

    - Minimum 3 years’ experience in customer support, with at least 1 year managing
    or leading people

    - Exposure to payments, fintech, or a fast-paced digital services environment
    highly preferred

    - Proven ability to handle escalations and complex customer issues

    - Strong track record of meeting SLAs and quality metrics

    - Confident coaching and developing team members

    - Excellent written and verbal communication skills

    - Proactive, solutions-driven approach and attention to detail

    - Comfortable working cross-functionally with technical and non-technical teams

    '
