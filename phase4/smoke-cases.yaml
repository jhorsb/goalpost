- case_id: sc-platform-engineer-02
  role: platform-engineer
  strength_band: borderline
  cv_text: "Maxwell Cotter  \nmaxwell.cotter@example.invalid | Brindleford\n\nPROFILE\
    \  \nPlatform Engineer with just over three years’ experience supporting and automating\
    \ cloud-native infrastructure. Adept at managing Kubernetes clusters on AWS, implementing\
    \ infrastructure as code with Terraform, and maintaining CI/CD pipelines. Collaborative\
    \ and motivated to improve reliability and observability. Eager to deepen skills\
    \ with GCP and multi-cloud environments.\n\nEXPERIENCE  \nPlatform Engineer  \n\
    Cloudspire Markets Ltd, Brindleford  \nMay 2022 – Present  \n- Managed AWS-based\
    \ production environments supporting a B2B e-commerce platform; maintained and\
    \ upgraded Kubernetes clusters (EKS).  \n- Developed and reviewed Terraform modules\
    \ to standardise infrastructure provisioning.  \n- Maintained and extended Jenkins\
    \ pipelines for CI/CD; introduced GitHub Actions for selected microservices, increasing\
    \ deployment velocity.  \n- Supported an on-call rota, diagnosing outages and\
    \ collaborating with developers to resolve incidents and improve system reliability.\
    \  \n- Integrated Prometheus and Grafana for monitoring; set up basic alerting\
    \ and dashboarding for application metrics.  \n- Delivered internal workshops\
    \ on infrastructure automation and monitoring practices.\n\nDevOps Engineer  \n\
    Northwell Digital Foods, Welford-on-Green  \nJuly 2020 – April 2022  \n- Assisted\
    \ in migration from on-prem to AWS, focusing on containerisation and initial Kubernetes\
    \ adoption.  \n- Automated stateless service deployments with Helm and basic bash/Python\
    \ scripts.  \n- Helped implement ELK stack for centralised log management and\
    \ troubleshooting.  \n- Contributed to Terraform codebase for managing VPCs, EC2,\
    \ and S3 resources.  \n- Supported small team with day-to-day troubleshooting\
    \ and monitoring system health.\n\nSKILLS  \n- Public Cloud: AWS (EC2, EKS, S3,\
    \ IAM), basic GCP exposure in sandbox environments  \n- Containerisation: Kubernetes\
    \ (EKS), Helm  \n- Infrastructure as Code: Terraform  \n- CI/CD: Jenkins, GitHub\
    \ Actions  \n- Programming: Python (intermediate), Go (basic scripting)  \n- Observability:\
    \ Prometheus, Grafana, ELK  \n- Collaboration: JIRA, Slack, Confluence\n\nEDUCATION\
    \  \nBSc (Hons) Computing and Networks  \nLinfield Technical University, Linfield\
    \  \n2017 – 2020\n\nOTHER  \n- AWS Certified Solutions Architect – Associate (2023)\
    \  \n- Actively studying for Certified Kubernetes Administrator (CKA)\n"
  job_spec_text: 'HarvestCart Group – Platform Engineer


    HarvestCart Group is a fast-growing online grocery marketplace based in Linfield,
    supporting thousands of daily orders across the UK. We are seeking a Platform
    Engineer to help scale and maintain our cloud-native infrastructure as we expand
    our offerings and customer base. You''ll join a small, collaborative team working
    across AWS and GCP, ensuring our Kubernetes clusters are secure, reliable, and
    ready for high-demand periods.


    You’ll design and implement infrastructure as code using Terraform, maintain and
    improve our CI/CD pipelines, and contribute to the design of scalable solutions
    for our microservices. This role also involves participating in an on-call rotation,
    supporting production systems, and working closely with developers to enhance
    platform reliability and observability.


    Requirements:

    - 3+ years’ experience as a DevOps, SRE, or Platform Engineer in production environments

    - Production experience managing Kubernetes clusters and at least one major public
    cloud (preferably AWS)

    - Proficiency in Python or Go for scripting and automation

    - Strong skills with Terraform and CI/CD pipelines (such as GitHub Actions or
    Jenkins)

    - Familiarity with observability tooling (e.g., Prometheus, Grafana, ELK)

    - Effective communicator and collaborative team player

    - AWS or CKA certification (desirable)

    - Experience in multi-cloud environments (desirable)

    '
- case_id: sc-data-analyst-02
  role: data-analyst
  strength_band: borderline
  cv_text: "Eleanor Broadley  \neleanor.broadley@example.invalid | Wrenthorpe\n\n\
    PROFILE  \nDetail-oriented data professional with two years of experience working\
    \ in analytics roles across financial services and retail. Adept in SQL and Python\
    \ for data extraction and cleaning, and experienced in producing reports and visualizations\
    \ for business users. Familiar with statistical analysis techniques and enthusiastic\
    \ about applying data-driven solutions to real-world business challenges. Strong\
    \ communicator with a track record of effective collaboration across departments.\
    \ Keen to further develop expertise in insurance analytics within a dynamic and\
    \ supportive environment.\n\nEXPERIENCE  \nHarborough Credit Limited, Data Analyst\
    \  \nApril 2022 – Present  \n- Developed and maintained SQL queries to extract\
    \ customer and transaction data for monthly finance reports, improving reporting\
    \ efficiency by 15%.  \n- Built automated Python scripts to clean data feeds,\
    \ reducing manual processing for the risk team.  \n- Created dashboards in Power\
    \ BI to track loan application trends, enabling management to identify key market\
    \ segments.  \n- Worked with risk analysts to support credit risk modelling projects,\
    \ providing data summaries and basic statistical analyses.  \n- Delivered findings\
    \ to business users in regular meetings, translating technical results into actionable\
    \ insights.\n\nLindley Homewares, Junior BI Analyst  \nJuly 2021 – March 2022\
    \  \n- Assisted in transforming point-of-sale and inventory data into actionable\
    \ sales reports using SQL.  \n- Supported migration of legacy Excel reports to\
    \ Tableau dashboards under supervision.  \n- Produced simple ad hoc analyses to\
    \ answer sales management queries, presenting findings in clear, accessible summaries.\
    \  \n- Coordinated with IT and sales teams to validate data integrity and resolve\
    \ discrepancies.\n\nSKILLS  \n- Proficient in SQL (data extraction, transformation,\
    \ joins, reporting)  \n- Working knowledge of Python (Pandas, data cleansing,\
    \ basic scripting)  \n- Experience with Power BI and introductory Tableau (dashboard\
    \ building and maintenance)  \n- Competent in Excel for analysis and reporting\
    \  \n- Foundational knowledge of statistics and data validation  \n- Strong verbal\
    \ and written communication  \n- Stakeholder engagement across technical and non-technical\
    \ teams\n\nEDUCATION  \nWestcroft University, BSc (Hons) Mathematics  \n2017 –\
    \ 2021\n\nOTHER  \n- Currently undertaking online course in insurance analytics\
    \  \n- Volunteered as data steward for Wrenthorpe Community Fundraiser 2023\n"
  job_spec_text: 'Holbrooke Mutual Insurance – Data Analyst


    Holbrooke Mutual Insurance is a respected regional provider of personal and commercial
    insurance, headquartered in the town of Ashfordley. We are seeking a Data Analyst
    to support our actuarial and claims teams by building robust analytics and reporting
    solutions. The successful candidate will develop and maintain data pipelines in
    SQL and Python, create insightful dashboards using Tableau (or similar tools),
    and play a key role in data-driven decision making across the business.


    You will work closely with actuarial colleagues to model risk and with claims
    managers to identify emerging trends. The ideal candidate will have a solid analytical
    background, keen attention to detail, and the ability to communicate technical
    findings clearly to non-technical audiences. This is an excellent opportunity
    for someone looking to broaden their experience in the insurance sector and contribute
    to a close-knit, friendly team.


    Requirements:

    - Minimum 2 years’ proven experience in a data analysis or business intelligence
    role

    - Advanced SQL skills and strong proficiency in Python for data analysis

    - Experience developing and maintaining dashboards in Tableau or a similar BI
    tool

    - Sound grasp of statistics and analytical methodologies

    - Excellent communication and stakeholder engagement skills

    - Prior exposure to insurance data or domain knowledge is advantageous

    '
- case_id: sc-frontend-developer-02
  role: frontend-developer
  strength_band: borderline
  cv_text: "Ruby Finlay  \nruby.finlay@example.invalid | Newridge-on-Thames\n\nPROFILE\
    \  \nFront-end developer with just over three years’ experience building web applications\
    \ with React and TypeScript. Committed to creating performant, visually consistent\
    \ interfaces and improving developer workflows. Hands-on experience with component\
    \ libraries and collaborative projects, with a growing focus on accessibility\
    \ and testing. Eager to contribute to ambitious teams making digital experiences\
    \ more inclusive and responsive.\n\nEXPERIENCE  \nJunior Frontend Developer  \n\
    AutumnArc Solutions, Baneshire  \nMarch 2021 – Present  \n- Developed and maintained\
    \ user-facing features for a property search platform using React (v17+) and TypeScript,\
    \ collaborating closely with UI/UX designers.  \n- Contributed to a small design\
    \ system: created a reusable button set and helped document component usage, but\
    \ have not led a full design system effort.  \n- Participated in accessibility\
    \ reviews for major product releases; implemented semantic HTML and basic ARIA\
    \ attributes, but limited experience with advanced WCAG criteria.  \n- Wrote and\
    \ maintained unit tests with Jest; integrated Testing Library for several new\
    \ features, and fixed test failures in existing codebase.  \n- Worked with backend\
    \ engineers to integrate REST APIs; familiar with code reviews and using git in\
    \ a collaborative team setting, primarily via GitLab.  \n- Monitored performance\
    \ using Lighthouse; made some improvements to resource loading, but limited experience\
    \ with formal performance budgeting.  \n- Assisted with migration of selected\
    \ pages to Next.js (v12), though have not set up server-side rendering independently.\
    \  \n- Supported basic CI integration with GitLab pipelines; limited exposure\
    \ to full CI/CD workflows and GitHub Actions.\n\nFrontend Intern  \nGreenleaf\
    \ Digital, Porthurst  \nJuly 2020 – Feb 2021  \n- Built simple React components\
    \ for a not-for-profit events app.  \n- Shadowed senior developers in feature\
    \ planning and code review sessions.  \n- Gained initial experience with TypeScript\
    \ and basic accessibility practices.\n\nSKILLS  \n- React (3 years), TypeScript\
    \ (2 years), JavaScript (ES6+)  \n- CSS Modules, Styled Components  \n- Basic\
    \ Next.js, Git, REST APIs  \n- Jest, Testing Library  \n- Figma (handoff), Storybook\
    \ (basic)  \n- Awareness of accessibility standards (working towards WCAG 2.1\
    \ AA)\n\nEDUCATION  \nDiploma in Web Application Development  \nArden Technical\
    \ College, Baneshire  \n2018 – 2020\n\nOTHER  \nMember, Baneshire Frontend Meetup\
    \ (2022– )\n"
  job_spec_text: 'WanderNest – Frontend Developer


    WanderNest is a rapidly growing travel-booking scale-up based in Harwell, Oxfordshire.
    We’re on a mission to simplify travel planning with a seamless, accessible booking
    experience. We are looking for a Frontend Developer to join our team and help
    build fast, reliable, and inclusive web applications.


    You’ll collaborate with designers and backend engineers to deliver high quality
    user interfaces using React and TypeScript. You’ll help maintain and evolve our
    design system, uphold accessibility best practices, and meet strict performance
    budgets. We value a strong testing culture and use modern CI/CD workflows to ensure
    reliable releases.


    Requirements:

    - Minimum 3 years’ experience in frontend development

    - Advanced proficiency in React and TypeScript

    - Experience implementing and maintaining design systems

    - Strong understanding of web accessibility standards (WCAG 2.1 or above)

    - Demonstrable experience with frontend testing frameworks (e.g. Jest, Testing
    Library)

    - Comfortable working to performance budgets and measuring web performance

    - Familiarity with code reviews and collaborative git workflows

    - Experience with Next.js and CI pipelines (e.g. GitHub Actions) is highly desirable

    - Excellent communication skills and collaborative mindset


    Join WanderNest as we redefine travel booking for everyone.

    '
- case_id: sc-project-manager-02
  role: project-manager
  strength_band: borderline
  cv_text: "Elliot Mason  \nelliot.mason@example.invalid | Moorley-on-Teal\n\nPROFILE\
    \  \nPractical and solutions-oriented project professional with over three years’\
    \ experience in civil construction, with a focus on small-scale infrastructure\
    \ upgrades. Known for effective coordination of trades and clear site communication.\
    \ Seeking to apply developing leadership skills and technical understanding to\
    \ the Project Manager role at ArdenVale Infrastructure.\n\nEXPERIENCE  \nSite\
    \ Project Coordinator  \nHickson & Bray Civil Solutions, Brentley, UK  \nMay 2021\
    \ – Present  \n- Supported the project management of highways resurfacing and\
    \ drainage works (project values up to £900k), ensuring works met client requirements\
    \ and program deadlines.  \n- Coordinated daily activities for site teams, including\
    \ subcontractors (up to 15 workers), and maintained records for site operations,\
    \ safety, and progress.  \n- Liaised directly with clients and the public regarding\
    \ works impact and managed minor complaints in collaboration with project leads.\
    \  \n- Assisted in the preparation of regular status and cost reports for management\
    \ and clients.  \n- Promoted safe working practices by conducting daily toolbox\
    \ talks and site inspections.  \n\nAssistant Project Manager (Graduate Scheme)\
    \  \nNorthern Counties Engineering, Finham, UK  \nSept 2019 – May 2021  \n- Supported\
    \ project managers on minor bridge repairs, cycle path upgrades, and utilities\
    \ diversions (project values up to £400k).  \n- Participated in meetings with\
    \ local council representatives and third-party stakeholders.  \n- Assisted in\
    \ progress reporting, cost tracking, and risk identification for assigned projects.\
    \  \n- Helped implement quality checks and follow-up on health and safety non-conformances.\
    \  \n\nSKILLS  \n- Coordination of small teams and subcontractors  \n- Familiarity\
    \ with NEC3/NEC4 contracts and CDM 2015  \n- Competence in Microsoft Project,\
    \ Excel, and basic CAD  \n- Clear written and verbal communication  \n- Early-stage\
    \ risk identification  \n- Budget tracking and basic cost reporting  \n- Strong\
    \ organisational skills  \n\nEDUCATION  \nBSc (Hons) Civil Engineering (2:1) \
    \ \nWest Teal University, 2016–2019  \n\nOTHER  \n- CSCS card (Professionally\
    \ Qualified Person)  \n- Currently undertaking APM Project Management Qualification\
    \ (APM PMQ) – expected completion August 2024  \n- Full UK driving licence\n"
  job_spec_text: 'ArdenVale Infrastructure – Project Manager


    ArdenVale Infrastructure is a well-established civil engineering consultancy based
    in the market town of Red Willow, specialising in delivering innovative infrastructure
    solutions for public and private sector clients. We are seeking an experienced
    Project Manager to oversee a range of infrastructure projects, from early planning
    through to completion.


    In this role, you will manage the full project lifecycle, including coordinating
    multidisciplinary teams, overseeing subcontractors, and ensuring all work is completed
    safely, on time, and within budget (up to £2m per project). You will be responsible
    for clear client communication, stakeholder management, and regular project reporting.
    The ability to foresee risks, resolve issues promptly, and maintain effective
    working relationships is essential.


    Requirements:

    - Minimum 4 years’ experience managing civil engineering or construction projects

    - Proven track record of successful project delivery with direct budget ownership

    - Skilled at coordinating subcontractors and internal teams to achieve project
    milestones

    - Strong communication and stakeholder management abilities with a client-focused
    approach

    - Experience producing accurate project reports and progress updates

    - Familiarity with industry standards and best practices for health and safety

    - PRINCE2 Practitioner or APM qualifications (desirable)

    - Excellent organisational and problem-solving skills

    '
