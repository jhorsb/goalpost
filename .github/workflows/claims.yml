name: Claims release gate

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the paper renderer
        uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e # v1.1.1
        with:
          version: "3.5"

      - name: Prove the release tree is reproducible offline
        run: uv run --frozen python tools/regenerate_release.py --check

      - name: Check release claims and generated surfaces
        run: uv run --frozen python tools/claims_lint.py

      - name: Prove the release gate fails closed
        run: uv run --frozen pytest tests/test_claims_lint.py

      - name: Run the full test suite
        run: uv run --frozen pytest

      - name: Run delegated contract tests
        run: uv run --frozen pytest -m codex
