    WanderNest is a rapidly growing travel-booking scale-up based in Harwell, Oxfordshire. We’re on a mission to simplify travel planning with a seamless, accessible booking experience. We are looking for a Frontend Developer to join our team and help build fast, reliable, and inclusive web applications.


    You’ll collaborate with designers and backend engineers to deliver high quality user interfaces using React and TypeScript. You’ll help maintain and evolve our design system, uphold accessibility best practices, and meet strict performance budgets. We value a strong testing culture and use modern CI/CD workflows to ensure reliable releases.


    Requirements:

    - Minimum 3 years’ experience in frontend development

    - Advanced proficiency in React and TypeScript

    - Experience implementing and maintaining design systems

    - Strong understanding of web accessibility standards (WCAG 2.1 or above)

    - Demonstrable experience with frontend testing frameworks (e.g. Jest, Testing Library)

    - Comfortable working to performance budgets and measuring web performance

    - Familiarity with code reviews and collaborative git workflows

    - Experience with Next.js and CI pipelines (e.g. GitHub Actions) is highly desirable

    - Excellent communication skills and collaborative mindset


    Join WanderNest as we redefine travel booking for everyone.

    '
