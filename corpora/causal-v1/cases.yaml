- case_id: sc-data-analyst-04__baseline
  role: data-analyst
  strength_band: borderline
  cv_text: "CV last updated: 1 September 2024.\n\nEleanor Waddington  \neleanor.waddington@example.invalid | West Bromleigh\n\nPROFILE  \nDetail-oriented data analyst with over 1.5 years’ experience working with diverse datasets in the financial services sector. Skilled at interpreting data, producing clear reports, and collaborating with business teams to inform strategic decisions. Proficient in SQL queries and data cleaning with Python. Eager to expand expertise in insurance analytics and contribute to effective data-driven solutions at Holbrooke Mutual Insurance.\n\nEXPERIENCE  \nData Analyst  \nHargrave Commercial Finance, West Bromleigh  \nMarch 2023 – Present  \n- Developed and maintained regular sales and risk reports for lending products, partnering closely with risk analysts and business managers.  \n- Constructed SQL queries to extract data for ad-hoc requests and monthly dashboards.  \n- Automated parts of the quarterly portfolio review using Python (Pandas, NumPy), reducing\
    \ manual processing time by 18%.  \n- Helped create interactive dashboards in Power BI to monitor customer churn and escalate key trends to decision makers.  \n- Supported compliance projects by analysing loan performance and generating datasets in line with regulatory standards.\n\nJunior Data Analyst (Internship)  \nKenswick Accountancy Solutions, Kenswick  \nJune 2022 – February 2023  \n- Assisted in compiling quarterly financial reports for private clients; validated data accuracy from multiple sources.  \n- Wrote basic SQL scripts to identify discrepancies and reconcile client accounts.  \n- Produced summary statistics for inclusion in client-facing presentations.  \n- Shadowed senior analysts on audit and fraud detection projects, learning core statistical concepts and Excel-based data visualisation.\n\nSKILLS  \n- SQL: building queries and data extractions (intermediate)  \n- Python: data cleaning and basic automation (Pandas, NumPy)  \n- BI Tools: Power BI (working knowledge),\
    \ limited exposure to Tableau during online coursework  \n- Data Visualisation: charts, dashboards, executive summaries  \n- Communication and presentation of analytical findings to non-technical teams  \n- Solid grasp of statistical measures (descriptive stats, distributions, correlation)\n\nEDUCATION  \nBSc Economics (2:1), South Shropshire University, 2022  \nRelevant coursework: Data Analysis, Applied Statistics, Introduction to Risk Management\n\nOTHER  \n- Currently undertaking an online Tableau fundamentals course  \n- Volunteer data assistant at West Bromleigh Library (ad hoc)\n"
