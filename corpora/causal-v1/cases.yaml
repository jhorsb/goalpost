  cv_text: "CV last updated: 1 September 2024.\n\nSophie McAllister  \nsophie.mcallister@example.invalid | Westridge\n\nPROFILE  \nMotivated and approachable customer support professional with three years’ experience in fast-paced digital service environments. Experienced in guiding small teams and resolving varied customer issues, primarily across digital subscription and e-commerce services. Adept at collaborating with cross-functional colleagues and maintaining service standards. Eager to build further leadership skills in fintech.\n\nEXPERIENCE\n\nOakstream Digital Ltd. — Customer Support Senior Agent  \nApril 2022 – Present, Westridge  \n- Provided frontline and second-line support for an e-commerce SaaS platform, handling customer queries via phone, chat, and email.  \n- Acted as informal deputy for the team supervisor during annual leave, assisting with shift allocation and urgent escalations for a team of 7.  \n- Led monthly discussion sessions to address recurring issues and propose\
    \ workflow refinements, coordinating with Product team on customer feedback.  \n- Consistently achieved response SLAs and high customer satisfaction scores.  \n- Mentored two new starters, delivering introductory product and soft-skills training.\n\nWestbrooke Media Solutions — Customer Support Associate  \nSep 2020 – Mar 2022, Westbrooke  \n- Fielded high-volume support requests for streaming service clients, collaborating with technical teams to resolve service disruption queries.  \n- Escalated complex technical tickets to Tier 2 and followed up to ensure closure.  \n- Supported regular updates to the internal knowledge base.  \n- Received “Customer Champion” award in Q3 2021 for positive feedback from customers.\n\nSKILLS  \n- Customer service and escalation management  \n- Informal people leadership and peer coaching  \n- SLA and quality metrics monitoring  \n- Cross-functional collaboration  \n- Strong written and verbal communication  \n- Familiarity with Zendesk, Freshdesk, and\
    \ Intercom  \n- Proficient with MS Office and Google Workspace\n\nEDUCATION  \nSouthshire College of Business  \nDiploma in Business and IT Support, 2020\n\nOTHER  \n- Volunteered as a digital skills tutor at Westridge Library, 2022  \n- Currently completing an online course in UK payments compliance\n"
