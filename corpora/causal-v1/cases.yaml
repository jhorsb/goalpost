  job_spec_text: 'Holbrooke Mutual Insurance – Data Analyst


    Holbrooke Mutual Insurance is a respected regional provider of personal and commercial insurance, headquartered in the town of Ashfordley. We are seeking a Data Analyst to support our actuarial and claims teams by building robust analytics and reporting solutions. The successful candidate will develop and maintain data pipelines in SQL and Python, create insightful dashboards using Tableau (or similar tools), and play a key role in data-driven decision making across the business.


    You will work closely with actuarial colleagues to model risk and with claims managers to identify emerging trends. The ideal candidate will have a solid analytical background, keen attention to detail, and the ability to communicate technical findings clearly to non-technical audiences. This is an excellent opportunity for someone looking to broaden their experience in the insurance sector and contribute to a close-knit, friendly team.


    Requirements:

    - Minimum 2 years’ proven experience in a data analysis or business intelligence role

    - Advanced SQL skills and strong proficiency in Python for data analysis

    - Experience developing and maintaining dashboards in Tableau or a similar BI tool

    - Sound grasp of statistics and analytical methodologies

    - Excellent communication and stakeholder engagement skills

    - Prior exposure to insurance data or domain knowledge is advantageous

    '
