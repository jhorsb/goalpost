cases:
- case_id: sc-data-analyst-02__baseline
  role: data-analyst
  strength_band: borderline
  cv_text: "CV last updated: 1 September 2024.\n\nEleanor Broadley  \neleanor.broadley@example.invalid | Wrenthorpe\n\nPROFILE  \nDetail-oriented data professional with two years of experience working in analytics roles across financial services and retail. Adept in SQL and Python for data extraction and cleaning, and experienced in producing reports and visualizations for business users. Familiar with statistical analysis techniques and enthusiastic about applying data-driven solutions to real-world business challenges. Strong communicator with a track record of effective collaboration across departments. Keen to further develop expertise in insurance analytics within a dynamic and supportive environment.\n\nEXPERIENCE  \nHarborough Credit Limited, Data Analyst  \nApril 2022 – Present  \n- Developed and maintained SQL queries to extract customer and transaction data for monthly finance reports, improving reporting efficiency by 15%.  \n- Built automated Python scripts to clean data feeds,\
    \ reducing manual processing for the risk team.  \n- Created dashboards in Power BI to track loan application trends, enabling management to identify key market segments.  \n- Worked with risk analysts to support credit risk modelling projects, providing data summaries and basic statistical analyses.  \n- Delivered findings to business users in regular meetings, translating technical results into actionable insights.\n\nLindley Homewares, Junior BI Analyst  \nJuly 2021 – March 2022  \n- Assisted in transforming point-of-sale and inventory data into actionable sales reports using SQL.  \n- Supported migration of legacy Excel reports to Tableau dashboards under supervision.  \n- Produced simple ad hoc analyses to answer sales management queries, presenting findings in clear, accessible summaries.  \n- Coordinated with IT and sales teams to validate data integrity and resolve discrepancies.\n\nSKILLS  \n- Proficient in SQL (data extraction, transformation, joins, reporting)  \n- Working\
    \ knowledge of Python (Pandas, data cleansing, basic scripting)  \n- Experience with Power BI and introductory Tableau (dashboard building and maintenance)  \n- Competent in Excel for analysis and reporting  \n- Foundational knowledge of statistics and data validation  \n- Strong verbal and written communication  \n- Stakeholder engagement across technical and non-technical teams\n\nEDUCATION  \nWestcroft University, BSc (Hons) Mathematics  \n2017 – 2021\n\nOTHER  \n- Currently undertaking online course in insurance analytics  \n- Volunteered as data steward for Wrenthorpe Community Fundraiser 2023\n"
  job_spec_text: 'Holbrooke Mutual Insurance – Data Analyst


    Holbrooke Mutual Insurance is a respected regional provider of personal and commercial insurance, headquartered in the town of Ashfordley. We are seeking a Data Analyst to support our actuarial and claims teams by building robust analytics and reporting solutions. The successful candidate will develop and maintain data pipelines in SQL and Python, create insightful dashboards using Tableau (or similar tools), and play a key role in data-driven decision making across the business.


    You will work closely with actuarial colleagues to model risk and with claims managers to identify emerging trends. The ideal candidate will have a solid analytical background, keen attention to detail, and the ability to communicate technical findings clearly to non-technical audiences. This is an excellent opportunity for someone looking to broaden their experience in the insurance sector and contribute to a close-knit, friendly team.


    Requirements:

    - Minimum 2 years’ proven experience in a data analysis or business intelligence role

    - Advanced SQL skills and strong proficiency in Python for data analysis

    - Experience developing and maintaining dashboards in Tableau or a similar BI tool

    - Sound grasp of statistics and analytical methodologies

    - Excellent communication and stakeholder engagement skills

    - Prior exposure to insurance data or domain knowledge is advantageous

    '
