- case_id: sc-data-analyst-01
  role: data-analyst
  strength_band: strong
  cv_text: "Jasleen Fairbairn  \njasleen.fairbairn@example.invalid | Clanmore\n\n\
    PROFILE  \nAnalytical and detail-oriented Data Analyst with over three years’\
    \ experience supporting decision-making in regulated sectors. Proven expertise\
    \ in SQL and Python for data pipeline development, dashboard creation in Tableau,\
    \ and clear communication of technical insights to diverse stakeholders. Experienced\
    \ in collaborating with actuarial and claims teams to enhance risk modelling and\
    \ trend analysis. Keen to bring my technical and interpersonal skills to contribute\
    \ effectively within the insurance sector at Holbrooke Mutual Insurance.\n\nEXPERIENCE\
    \  \nData Analyst  \nCavendale Risk Partners, Clanmore  \nAugust 2021 – Present\
    \  \n- Developed and maintained SQL and Python-based data pipelines for actuarial\
    \ and claims management teams, improving data reliability and accessibility for\
    \ reporting and risk analysis  \n- Built and deployed over 15 interactive Tableau\
    \ dashboards, providing both technical and non-technical users with actionable\
    \ insights into claims patterns, customer demographics, and emerging risk areas\
    \  \n- Collaborated with actuaries to refine predictive claims models using statistical\
    \ techniques (regression, time-series analysis) and supported quarterly risk reviews\
    \  \n- Engaged regularly with claims managers to identify trends such as fraud\
    \ risk and cost drivers, presenting findings in clear, business-oriented language\
    \  \n- Automated monthly data quality reports, reducing manual processing time\
    \ by 30% and improving data integrity across key business processes\n\nJunior\
    \ Business Intelligence Analyst  \nSolstice Assurance Ltd, Harlthwaite  \nJune\
    \ 2019 – July 2021  \n- Supported data gathering and cleaning for insurance claims\
    \ and customer datasets using SQL and Python  \n- Assisted in creating Tableau\
    \ visualisations for senior management, helping to monitor KPIs and claims performance\
    \  \n- Worked closely with business users to translate analytical findings into\
    \ practical recommendations  \n- Participated in user requirement sessions and\
    \ UAT for new BI initiatives\n\nSKILLS  \n- Advanced SQL (Postgres, SQL Server),\
    \ strong proficiency in Python (Pandas, NumPy, matplotlib)  \n- Tableau dashboard\
    \ creation and maintenance; experience with Power BI  \n- Statistical analysis\
    \ and data modelling  \n- Data cleansing and ETL processes  \n- Excellent written\
    \ and verbal communication; stakeholder engagement\n\nEDUCATION  \nBSc (Hons)\
    \ in Mathematics and Data Science  \nAldwyck University, 2016 – 2019\n\nOTHER\
    \  \nMember, UK Society for Data Analytics  \nTableau Desktop Specialist Certification\
    \ (2022)\n"
  job_spec_text: 'Holbrooke Mutual Insurance – Data Analyst


    Holbrooke Mutual Insurance is a respected regional provider of personal and commercial
    insurance, headquartered in the town of Ashfordley. We are seeking a Data Analyst
    to support our actuarial and claims teams by building robust analytics and reporting
    solutions. The successful candidate will develop and maintain data pipelines in
    SQL and Python, create insightful dashboards using Tableau (or similar tools),
    and play a key role in data-driven decision making across the business.


    You will work closely with actuarial colleagues to model risk and with claims
    managers to identify emerging trends. The ideal candidate will have a solid analytical
    background, keen attention to detail, and the ability to communicate technical
    findings clearly to non-technical audiences. This is an excellent opportunity
    for someone looking to broaden their experience in the insurance sector and contribute
    to a close-knit, friendly team.


    Requirements:

    - Minimum 2 years’ proven experience in a data analysis or business intelligence
    role

    - Advanced SQL skills and strong proficiency in Python for data analysis

    - Experience developing and maintaining dashboards in Tableau or a similar BI
    tool

    - Sound grasp of statistics and analytical methodologies

    - Excellent communication and stakeholder engagement skills

    - Prior exposure to insurance data or domain knowledge is advantageous

    '
