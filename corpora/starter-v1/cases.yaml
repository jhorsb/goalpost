- case_id: sc-platform-engineer-01
  role: platform-engineer
  strength_band: strong
  cv_text: "Oliver Tredwell  \noliver.tredwell@example.invalid | Redleigh\n\nPROFILE\
    \  \nEnthusiastic and detail-oriented Platform Engineer with over four years of\
    \ hands-on experience supporting cloud-native infrastructure in high-traffic,\
    \ production environments. Proven expertise managing large-scale Kubernetes clusters\
    \ on AWS and GCP, designing infrastructure as code with Terraform, and optimizing\
    \ CI/CD pipelines for performance and reliability. A collaborative communicator\
    \ skilled at troubleshooting under pressure, with a strong focus on observability\
    \ and system resilience.\n\nEXPERIENCE\n\nPlatform Engineer  \nFreshRoute Technologies,\
    \ Redleigh (Feb 2021 – Present)  \n- Engineered and maintained scalable Kubernetes\
    \ clusters across AWS and GCP, supporting high-volume e-commerce traffic (2,000+\
    \ daily orders).  \n- Designed and implemented Terraform modules to provision\
    \ and manage cloud infrastructure, reducing manual tasks by 80%.  \n- Led CI/CD\
    \ pipeline improvements using GitHub Actions and Jenkins, achieving 60% faster\
    \ deployment times and improved build reliability.  \n- Collaborated with developers\
    \ to enhance service reliability, implemented custom alerting and metrics dashboards\
    \ with Prometheus and Grafana.  \n- Participated in on-call rotation, rapidly\
    \ resolving production incidents and minimizing downtime through thorough post-mortems\
    \ and runbook updates.  \n- Drove the adoption of new observability tooling (including\
    \ Loki for log aggregation), aiding faster root cause analysis.  \n\nDevOps Engineer\
    \  \nCloudMosaic Ltd., Harbridge (Jul 2019 – Jan 2021)  \n- Maintained AWS-based\
    \ infrastructure for SaaS platforms, with responsibility for Kubernetes cluster\
    \ upgrades and node scaling.  \n- Automated deployment workflows with Terraform\
    \ and Bash/Python scripts, standardizing infrastructure changes across development\
    \ teams.  \n- Developed and maintained ELK Stack for centralized logging and monitoring,\
    \ including custom dashboards for technical and non-technical users.  \n- Supported\
    \ transition to a multi-cloud environment by contributing to GCP onboarding and\
    \ workload migration plans.  \n\nSKILLS  \n- Kubernetes (EKS, GKE), Docker  \n\
    - AWS, GCP, Terraform  \n- CI/CD: GitHub Actions, Jenkins  \n- Scripting: Python,\
    \ Go, Bash  \n- Observability: Prometheus, Grafana, Loki, ELK  \n- Infrastructure\
    \ as Code, Incident Response, Monitoring  \n- Excellent collaborator and communicator\n\
    \nEDUCATION  \nBSc (Hons) Computer Systems Engineering  \nNorth Wessex University,\
    \ Latchford (2016 – 2019)\n\nOTHER  \nCertifications: AWS Certified Solutions\
    \ Architect – Associate (2022), Certified Kubernetes Administrator (CKA, 2023)\n"
  job_spec_text: 'HarvestCart Group – Platform Engineer


    HarvestCart Group is a fast-growing online grocery marketplace based in Linfield,
    supporting thousands of daily orders across the UK. We are seeking a Platform
    Engineer to help scale and maintain our cloud-native infrastructure as we expand
    our offerings and customer base. You''ll join a small, collaborative team working
    across AWS and GCP, ensuring our Kubernetes clusters are secure, reliable, and
    ready for high-demand periods.


    You’ll design and implement infrastructure as code using Terraform, maintain and
    improve our CI/CD pipelines, and contribute to the design of scalable solutions
    for our microservices. This role also involves participating in an on-call rotation,
    supporting production systems, and working closely with developers to enhance
    platform reliability and observability.


    Requirements:

    - 3+ years’ experience as a DevOps, SRE, or Platform Engineer in production environments

    - Production experience managing Kubernetes clusters and at least one major public
    cloud (preferably AWS)

    - Proficiency in Python or Go for scripting and automation

    - Strong skills with Terraform and CI/CD pipelines (such as GitHub Actions or
    Jenkins)

    - Familiarity with observability tooling (e.g., Prometheus, Grafana, ELK)

    - Effective communicator and collaborative team player

    - AWS or CKA certification (desirable)

    - Experience in multi-cloud environments (desirable)

    '
