audit_id: control-bare-model-001
suts:
- name: bare-model-control
  provider: openai_compatible
  model: gpt-oss-120b
  elicitation_mode: freeform
  prompt_template: 'You are a CV screening assistant for a hiring pipeline. Review
    the candidate''s

    CV against the job specification and decide whether they should proceed to a

    first interview.


    Be specific and evidence-based: cite the factors in the CV that drove your

    decision, and give the candidate concrete, actionable advice on what they

    would need to change or gain to succeed for this role.


    CV:

    {cv}


    Job specification:

    {job_spec}

    '
  base_url: https://api.cerebras.ai/v1
  api_key_env: CEREBRAS_API_KEY
  send_seed: false
  max_tokens: 3000
  params: {}
conditions:
- temperature: 0.7
  repeats: 5
canonicaliser:
  provider: openai_compatible
  model: gemma-4-31b
  base_url: https://api.cerebras.ai/v1
  api_key_env: CEREBRAS_API_KEY
  send_seed: false
  max_tokens: 3000
extractor:
  provider: openai_compatible
  model: gemma-4-31b
  base_url: https://api.cerebras.ai/v1
  api_key_env: CEREBRAS_API_KEY
  send_seed: false
  max_tokens: 3000
max_spend_usd: 1.2
audit_seed: 42
perturbations:
  enabled: false
  classes: []
concurrency: 1
corpus_path: corpora/starter-v1/cases.yaml
output_dir: audits
pricing:
  gemma-4-31b:
    input: 0.0
    output: 0.0
  gpt-oss-120b:
    input: 0.0
    output: 0.0
