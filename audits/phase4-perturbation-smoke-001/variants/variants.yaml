- variant_id: sc-data-analyst-02+whitespace
  case_id: sc-data-analyst-02
  perturbation_class: whitespace
  content_hash: a4ffda44573986ddd8c53ded16484833e783b8bff1d714fea96dafb9eec86fa9
  cv_text: "Eleanor Broadley  \neleanor.broadley@example.invalid | Wrenthorpe  \n\n\
    PROFILE  \nDetail-oriented data professional with two years of experience working\
    \ in analytics roles across financial services and retail. Adept in SQL and Python\
    \ for data extraction and cleaning, and experienced in producing reports and visualizations\
    \ for business users. Familiar with statistical analysis techniques and enthusiastic\
    \ about applying data-driven solutions to real-world business challenges. Strong\
    \ communicator with a track record of effective collaboration across departments.\
    \ Keen to further develop expertise in insurance analytics within a dynamic and\
    \ supportive environment.  \n\nEXPERIENCE  \nHarborough Credit Limited, Data Analyst\
    \  \nApril 2022 – Present    \n- Developed and maintained SQL queries to extract\
    \ customer and transaction data for monthly finance reports, improving reporting\
    \ efficiency by 15%.    \n- Built automated Python scripts to clean data feeds,\
    \ reducing manual processing for the risk team.  \n- Created dashboards in Power\
    \ BI to track loan application trends, enabling management to identify key market\
    \ segments.  \n- Worked with risk analysts to support credit risk modelling projects,\
    \ providing data summaries and basic statistical analyses.    \n- Delivered findings\
    \ to business users in regular meetings, translating technical results into actionable\
    \ insights.\n\n\nLindley Homewares, Junior BI Analyst    \nJuly 2021 – March 2022\
    \  \n- Assisted in transforming point-of-sale and inventory data into actionable\
    \ sales reports using SQL.    \n- Supported migration of legacy Excel reports\
    \ to Tableau dashboards under supervision.    \n- Produced simple ad hoc analyses\
    \ to answer sales management queries, presenting findings in clear, accessible\
    \ summaries.    \n- Coordinated with IT and sales teams to validate data integrity\
    \ and resolve discrepancies.  \n\n\nSKILLS  \n- Proficient in SQL (data extraction,\
    \ transformation, joins, reporting)    \n- Working knowledge of Python (Pandas,\
    \ data cleansing, basic scripting)  \n- Experience with Power BI and introductory\
    \ Tableau (dashboard building and maintenance)    \n- Competent in Excel for analysis\
    \ and reporting  \n- Foundational knowledge of statistics and data validation\
    \  \n- Strong verbal and written communication    \n- Stakeholder engagement across\
    \ technical and non-technical teams\n\nEDUCATION    \nWestcroft University, BSc\
    \ (Hons) Mathematics    \n2017 – 2021  \n\n\nOTHER  \n- Currently undertaking\
    \ online course in insurance analytics  \n- Volunteered as data steward for Wrenthorpe\
    \ Community Fundraiser 2023"
