  cv_text: "Maxwell Cotter    \nmaxwell.cotter@example.invalid | Brindleford\n\nPROFILE\
    \  \nPlatform Engineer with just over three years’ experience supporting and automating\
    \ cloud-native infrastructure. Adept at managing Kubernetes clusters on AWS, implementing\
    \ infrastructure as code with Terraform, and maintaining CI/CD pipelines. Collaborative\
    \ and motivated to improve reliability and observability. Eager to deepen skills\
    \ with GCP and multi-cloud environments.  \n\nEXPERIENCE    \nPlatform Engineer\
    \    \nCloudspire Markets Ltd, Brindleford    \nMay 2022 – Present    \n- Managed\
    \ AWS-based production environments supporting a B2B e-commerce platform; maintained\
    \ and upgraded Kubernetes clusters (EKS).  \n- Developed and reviewed Terraform\
    \ modules to standardise infrastructure provisioning.    \n- Maintained and extended\
    \ Jenkins pipelines for CI/CD; introduced GitHub Actions for selected microservices,\
    \ increasing deployment velocity.    \n- Supported an on-call rota, diagnosing\
    \ outages and collaborating with developers to resolve incidents and improve system\
    \ reliability.    \n- Integrated Prometheus and Grafana for monitoring; set up\
    \ basic alerting and dashboarding for application metrics.  \n- Delivered internal\
    \ workshops on infrastructure automation and monitoring practices.\n\n\nDevOps\
    \ Engineer  \nNorthwell Digital Foods, Welford-on-Green  \nJuly 2020 – April 2022\
    \  \n- Assisted in migration from on-prem to AWS, focusing on containerisation\
    \ and initial Kubernetes adoption.  \n- Automated stateless service deployments\
    \ with Helm and basic bash/Python scripts.  \n- Helped implement ELK stack for\
    \ centralised log management and troubleshooting.    \n- Contributed to Terraform\
    \ codebase for managing VPCs, EC2, and S3 resources.    \n- Supported small team\
    \ with day-to-day troubleshooting and monitoring system health.  \n\n\nSKILLS\
    \  \n- Public Cloud: AWS (EC2, EKS, S3, IAM), basic GCP exposure in sandbox environments\
    \    \n- Containerisation: Kubernetes (EKS), Helm    \n- Infrastructure as Code:\
    \ Terraform  \n- CI/CD: Jenkins, GitHub Actions    \n- Programming: Python (intermediate),\
    \ Go (basic scripting)    \n- Observability: Prometheus, Grafana, ELK  \n- Collaboration:\
    \ JIRA, Slack, Confluence\n\nEDUCATION  \nBSc (Hons) Computing and Networks  \
    \  \nLinfield Technical University, Linfield  \n2017 – 2020\n\n\nOTHER    \n-\
    \ AWS Certified Solutions Architect – Associate (2023)  \n- Actively studying\
    \ for Certified Kubernetes Administrator (CKA)"
