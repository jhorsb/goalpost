  cv_text: "Ruby Finlay    \nruby.finlay@example.invalid | Newridge-on-Thames  \n\n\
    \nPROFILE  \nFront-end developer with just over three years’ experience building\
    \ web applications with React and TypeScript. Committed to creating performant,\
    \ visually consistent interfaces and improving developer workflows. Hands-on experience\
    \ with component libraries and collaborative projects, with a growing focus on\
    \ accessibility and testing. Eager to contribute to ambitious teams making digital\
    \ experiences more inclusive and responsive.  \n\nEXPERIENCE    \nJunior Frontend\
    \ Developer    \nAutumnArc Solutions, Baneshire    \nMarch 2021 – Present    \n\
    - Developed and maintained user-facing features for a property search platform\
    \ using React (v17+) and TypeScript, collaborating closely with UI/UX designers.\
    \  \n- Contributed to a small design system: created a reusable button set and\
    \ helped document component usage, but have not led a full design system effort.\
    \    \n- Participated in accessibility reviews for major product releases; implemented\
    \ semantic HTML and basic ARIA attributes, but limited experience with advanced\
    \ WCAG criteria.  \n- Wrote and maintained unit tests with Jest; integrated Testing\
    \ Library for several new features, and fixed test failures in existing codebase.\
    \    \n- Worked with backend engineers to integrate REST APIs; familiar with code\
    \ reviews and using git in a collaborative team setting, primarily via GitLab.\
    \  \n- Monitored performance using Lighthouse; made some improvements to resource\
    \ loading, but limited experience with formal performance budgeting.  \n- Assisted\
    \ with migration of selected pages to Next.js (v12), though have not set up server-side\
    \ rendering independently.  \n- Supported basic CI integration with GitLab pipelines;\
    \ limited exposure to full CI/CD workflows and GitHub Actions.  \n\n\nFrontend\
    \ Intern  \nGreenleaf Digital, Porthurst    \nJuly 2020 – Feb 2021    \n- Built\
    \ simple React components for a not-for-profit events app.  \n- Shadowed senior\
    \ developers in feature planning and code review sessions.    \n- Gained initial\
    \ experience with TypeScript and basic accessibility practices.\n\nSKILLS  \n\
    - React (3 years), TypeScript (2 years), JavaScript (ES6+)  \n- CSS Modules, Styled\
    \ Components  \n- Basic Next.js, Git, REST APIs  \n- Jest, Testing Library   \
    \ \n- Figma (handoff), Storybook (basic)    \n- Awareness of accessibility standards\
    \ (working towards WCAG 2.1 AA)  \n\nEDUCATION  \nDiploma in Web Application Development\
    \    \nArden Technical College, Baneshire  \n2018 – 2020  \n\n\nOTHER  \nMember,\
    \ Baneshire Frontend Meetup (2022– )  "
