  cv_text: "Elliot Mason    \nelliot.mason@example.invalid | Moorley-on-Teal\n\n\n\
    PROFILE    \nPractical and solutions-oriented project professional with over three\
    \ years’ experience in civil construction, with a focus on small-scale infrastructure\
    \ upgrades. Known for effective coordination of trades and clear site communication.\
    \ Seeking to apply developing leadership skills and technical understanding to\
    \ the Project Manager role at ArdenVale Infrastructure.\n\n\nEXPERIENCE  \nSite\
    \ Project Coordinator    \nHickson & Bray Civil Solutions, Brentley, UK  \nMay\
    \ 2021 – Present    \n- Supported the project management of highways resurfacing\
    \ and drainage works (project values up to £900k), ensuring works met client requirements\
    \ and program deadlines.    \n- Coordinated daily activities for site teams, including\
    \ subcontractors (up to 15 workers), and maintained records for site operations,\
    \ safety, and progress.    \n- Liaised directly with clients and the public regarding\
    \ works impact and managed minor complaints in collaboration with project leads.\
    \  \n- Assisted in the preparation of regular status and cost reports for management\
    \ and clients.  \n- Promoted safe working practices by conducting daily toolbox\
    \ talks and site inspections.  \n\nAssistant Project Manager (Graduate Scheme)\
    \  \nNorthern Counties Engineering, Finham, UK  \nSept 2019 – May 2021    \n-\
    \ Supported project managers on minor bridge repairs, cycle path upgrades, and\
    \ utilities diversions (project values up to £400k).    \n- Participated in meetings\
    \ with local council representatives and third-party stakeholders.    \n- Assisted\
    \ in progress reporting, cost tracking, and risk identification for assigned projects.\
    \    \n- Helped implement quality checks and follow-up on health and safety non-conformances.\
