  content_hash: 5e4645df7129be5587b00779bedcc9877730f3c2ffc5c2365a81e4fad67e7c97
  cv_text: "Olivia Marsh  \nolivia.marsh@example.invalid | Bexwood\n\n\nPROFILE  \n\
    Motivated customer support professional with three years’ experience in digital\
    \ services, including 8 months in a supervisory role. Skilled in resolving customer\
    \ issues, managing small teams, and supporting process improvements. Highly organized,\
    \ with a keen eye for detail and a commitment to delivering positive customer\
    \ outcomes. Eager to develop further leadership skills in a fast-paced fintech\
    \ environment.\n\n\nEXPERIENCE  \nSenior Customer Support Advisor (Acting Team\
    \ Lead)  \nBrightHive Digital, Bexwood  \nSeptember 2023 – Present  \n- Stepped\
    \ into an acting team lead position, supervising 4 support agents during the team\
    \ manager’s parental leave.    \n- Coordinated daily support operations for SME\
    \ clients using BrightHive’s digital invoicing platform.  \n- Handled high-priority\
    \ customer escalations and worked with tech staff to resolve platform bugs.  \n\
    - Conducted weekly training sessions on updated support tools and product features.\
    \  \n- Assisted in developing a new ticket triage process that reduced first-response\
    \ times by 12%.  \n- Regularly monitored SLA dashboards and produced monthly performance\
    \ reports for management review.  \n\n\nCustomer Support Advisor    \nBrightHive\
    \ Digital, Bexwood    \nMarch 2021 – September 2023    \n- Provided front-line\
    \ support via chat, email, and phone for digital payment and invoicing queries.\
    \    \n- Regularly achieved or surpassed team targets for response times and customer\
    \ satisfaction.  \n- Escalated complex technical problems to IT, documenting root\
    \ causes and solutions.    \n- Contributed to support documentation updates and\
    \ new team member onboarding.  \n\nSKILLS  \n- Incident and escalation management\
    \  \n- Delivering constructive feedback  \n- Customer communications (written\
    \ and verbal)    \n- Familiar with Zendesk, Intercom, and MS Teams    \n- Basic\
    \ understanding of digital payments    \n- Process documentation and knowledge\
    \ sharing\n\n\nEDUCATION  \nLevel 3 Diploma in Customer Service    \nKingsford\
    \ Adult Learning Centre, 2020  \n\nOTHER  \nVolunteer Tech Buddy, Bexwood Community\
    \ Library (2022–present): Assisting local residents with digital literacy and\
    \ online services.    \n\nReferences available on request."
