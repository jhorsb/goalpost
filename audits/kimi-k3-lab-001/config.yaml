audit_id: kimi-k3-lab-001
suts:
- name: kimi-k3
  provider: openai_compatible
  model: kimi-k3
  elicitation_mode: structured
  prompt_template: 'You are a CV screening assistant for a hiring pipeline. Review
    the candidate''s

    CV against the job specification and decide whether they should proceed to a

    first interview.


    Be specific and evidence-based: cite the factors in the CV that drove your

    decision, and give the candidate concrete, actionable advice on what they

    would need to change or gain to succeed for this role.


    CV:

    {cv}


    Job specification:

    {job_spec}

    '
  base_url: https://api.moonshot.ai/v1
  api_key_env: MOONSHOT_API_KEY
  send_seed: true
  max_tokens: 3000
  params: {}
conditions:
- temperature: 1.0
  repeats: 5
