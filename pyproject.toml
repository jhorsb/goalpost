[project]
name = "goalpost"
version = "0.1.0"
description = "CLI audit instrument for decision/reason/recourse stability in LLM-mediated screening pipelines"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[project.scripts]
goalpost = "goalpost.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "hypothesis>=6.100"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goalpost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
